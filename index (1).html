
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Calculadora de Alquimia para Vapear</title>
  <style>
    body {
      font-family: sans-serif;
      background: #111;
      color: #eee;
      padding: 2rem;
    }
    input, select, button {
      padding: 0.5rem;
      margin: 0.5rem 0;
      font-size: 1rem;
    }
    .resultado {
      margin-top: 2rem;
      background: #222;
      padding: 1rem;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <h1>Calculadora de Alquimia para Vapear</h1>
  <p>Introduce las proporciones deseadas:</p>
  
  <label>Volumen final (ml):</label>
  <input type="number" id="volumen" placeholder="Ej: 100"><br>
  
  <label>PG (%):</label>
  <input type="number" id="pg" placeholder="Ej: 50"><br>
  
  <label>VG (%):</label>
  <input type="number" id="vg" placeholder="Ej: 50"><br>
  
  <label>Nicotina base (mg/ml):</label>
  <input type="number" id="nicotinaBase"><br>
  
  <label>Nivel de nicotina deseado (mg/ml):</label>
  <input type="number" id="nicotinaFinal"><br>
  
  <label>Porcentaje de aroma (%):</label>
  <input type="number" id="aroma"><br>
  
  <button onclick="calcular()">Calcular</button>
  
  <div class="resultado" id="resultado"></div>
  
  <script>
    function calcular() {
      const vTotal = parseFloat(document.getElementById('volumen').value);
      const pg = parseFloat(document.getElementById('pg').value);
      const vg = parseFloat(document.getElementById('vg').value);
      const nicBase = parseFloat(document.getElementById('nicotinaBase').value);
      const nicFinal = parseFloat(document.getElementById('nicotinaFinal').value);
      const aroma = parseFloat(document.getElementById('aroma').value);

      const aromaMl = (aroma / 100) * vTotal;
      const nicMl = (nicFinal * vTotal) / nicBase;
      const baseMl = vTotal - aromaMl - nicMl;

      const resultado = `
        <p><strong>Aroma:</strong> ${aromaMl.toFixed(2)} ml</p>
        <p><strong>Base de nicotina:</strong> ${nicMl.toFixed(2)} ml</p>
        <p><strong>Base PG/VG sin nicotina:</strong> ${baseMl.toFixed(2)} ml</p>
      `;
      document.getElementById('resultado').innerHTML = resultado;
    }
  </script>
</body>
</html>
